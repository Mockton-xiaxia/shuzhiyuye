services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: fishery
      POSTGRES_PASSWORD: fishery
      POSTGRES_DB: fishery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishery -d fishery"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fishery:fishery@db:5432/fishery
      JWT_SECRET: fishery-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend/apps/admin
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
